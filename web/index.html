<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Siembra · Pronóstico de siembra adaptable</title>
  <meta name="description" content="Recomienda la fecha óptima de siembra con cadenas de Márkov, Montecarlo, Poisson y Galton-Watson. Corre en tu dispositivo.">
  <meta name="theme-color" content="#1f7a4d">
  <link rel="icon" href="icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icono-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="estilos.css">
  <script>
    // Tema antes de pintar (evita un destello): el guardado o, si no hay, el del sistema.
    try {
      const t = localStorage.getItem("siembra-tema") || (matchMedia("(prefers-color-scheme: dark)").matches ? "oscuro" : "claro");
      document.documentElement.dataset.tema = t;
    } catch (e) { document.documentElement.dataset.tema = "claro"; }
  </script>
</head>
<body>
  <div class="carga" id="carga" role="status" aria-live="polite">
    <div class="caja">
      <div class="logo" aria-hidden="true">✿</div>
      <p class="t15 b" style="margin-top:8px">Siembra</p>
      <p class="suave" id="carga-texto">Iniciando…</p>
      <div class="barra-prog"><div id="carga-barra"></div></div>
      <p class="suave t10">La primera vez tarda unos segundos: se descarga el motor de simulación para que corra en tu dispositivo.</p>
    </div>
  </div>
  <div class="app" id="app"></div>
  <script src="app.js"></script>
</body>
</html>
